<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentrail · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F6;--panel:#FFFFFF;--ink:#17212B;--ink-2:#4A5763;--ink-3:#7A8590;--line:#DCE1E5;--line-2:#C5CCD2;
  --petrol:#0F4C5C;--petrol-soft:#E3EEF0;--high:#B3261E;--high-soft:#FBE9E7;--med:#9A6200;--med-soft:#FBF1DE;
  --low:#2E7D4F;--low-soft:#E5F2EA;--chain:#4B3FA8;--chain-soft:#ECEAF8;--focus:#1D6FD1;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171C;--panel:#182129;--ink:#E6EBEF;--ink-2:#AEB8C1;--ink-3:#7F8B96;--line:#27323B;--line-2:#34424D;
  --petrol:#5FB3C4;--petrol-soft:#16313A;--high:#F08A80;--high-soft:#3A1D1B;--med:#E2B05A;--med-soft:#3A2D14;
  --low:#78C79A;--low-soft:#173025;--chain:#A99CF2;--chain-soft:#25213F;--focus:#6AA8F0;}}
:root[data-theme="dark"]{
  --paper:#11171C;--panel:#182129;--ink:#E6EBEF;--ink-2:#AEB8C1;--ink-3:#7F8B96;--line:#27323B;--line-2:#34424D;
  --petrol:#5FB3C4;--petrol-soft:#16313A;--high:#F08A80;--high-soft:#3A1D1B;--med:#E2B05A;--med-soft:#3A2D14;
  --low:#78C79A;--low-soft:#173025;--chain:#A99CF2;--chain-soft:#25213F;--focus:#6AA8F0;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em;white-space:nowrap}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{flex:none}
.brand{padding-bottom:10px!important}
.tenant{display:flex;gap:10px;align-items:center;margin:0 4px 12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.tenant .av{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.tenant .tn{font-weight:600;font-size:13.5px;line-height:1.25;color:var(--ink)}
.tenant .tm{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.env{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.env.prod{background:var(--low-soft);color:var(--low)}.env.sandbox{background:var(--med-soft);color:var(--med)}.env.platform{background:var(--chain-soft);color:var(--chain)}
body.sandbox .topbar{border-top:3px solid var(--med)}
body.signedout .rail,body.signedout .topbar{display:none!important}
body.signedout .app{grid-template-columns:1fr}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.login .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:18px}
.login .via{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:16px}
.login .full{width:100%;justify-content:center;display:flex;margin-top:6px}
.demo{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--ink-3)}
.demo button{all:unset;cursor:pointer;display:block;padding:3px 0;color:var(--petrol)}
.demo button:focus-visible{outline:2px solid var(--focus)}
.idp{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;margin:12px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--petrol);animation:spin .8s linear infinite;flex:none}
.sess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess:last-child{border-bottom:0}.sess small{color:var(--ink-3);font-size:12.5px}
.linkbtn{all:unset;cursor:pointer;color:var(--petrol);font-weight:500;font-size:13px}
.linkbtn:focus-visible{outline:2px solid var(--focus)}
.navgroup:first-of-type{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink-2)}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.stat.warn b{color:var(--med)}.stat.bad b{color:var(--high)}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.todo:last-child{border-bottom:0}
.todo:hover .t1{color:var(--petrol)}
.todo .t1{font-weight:600}
.todo .t2{grid-column:2;font-size:13px;color:var(--ink-2)}
.todo .kindtag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--chain-soft);color:var(--chain)}
.todo .kindtag.al{background:var(--petrol-soft);color:var(--petrol)}
.wait{font-size:12.5px;color:var(--med);font-weight:600;text-align:right}
.feed div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed div:last-child{border-bottom:0}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:6px;color:var(--ink-2);font-weight:500}
.rail button:hover{background:var(--paper)}
.rail button[aria-current="page"]{background:var(--petrol-soft);color:var(--petrol)}
.rail .count{font-size:12px;background:var(--high-soft);color:var(--high);padding:1px 7px;border-radius:10px}
.rail .who{margin-top:auto;font-size:13px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.rail .who strong{display:block;color:var(--ink);font-weight:600}
main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 380px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:0 10px}
.search input{flex:1;border:0;background:transparent;padding:10px 4px;outline:none;min-width:0}
.search:focus-within{border-color:var(--focus)}
.kind{font-size:12px;padding:3px 8px;border-radius:5px;background:var(--paper);color:var(--ink-3);white-space:nowrap}
.kind.wallet{background:var(--chain-soft);color:var(--chain)}
.kind.bad{background:var(--high-soft);color:var(--high)}
.kind.ok{background:var(--petrol-soft);color:var(--petrol)}
select.reason{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:9px 8px}
.page{padding:24px 28px 60px;max-width:1240px}
h1{font-size:24px;letter-spacing:-.015em;margin:0 0 4px;font-weight:700}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
.sub{color:var(--ink-2);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0B1A1F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1A1F}}
.btn.danger{color:var(--high);border-color:var(--high)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;min-width:680px;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--paper)}
.score{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.score i{display:block;width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.score i b{position:absolute;inset:0 auto 0 0;border-radius:3px}
.band{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.band.high{background:var(--high-soft);color:var(--high)}.band.medium{background:var(--med-soft);color:var(--med)}.band.low{background:var(--low-soft);color:var(--low)}
.ch{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--paper);color:var(--ink-2);margin-right:4px;border:1px solid var(--line)}
.ch.crypto{background:var(--chain-soft);color:var(--chain);border-color:transparent}
.muted{color:var(--ink-3)}
.casehead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;margin-bottom:18px}
.dial{display:flex;align-items:center;gap:14px}
.dial .num{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.facts{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.facts b{display:block;white-space:nowrap;color:var(--ink);font-weight:600;font-size:14.5px}
.reason{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.reason:last-child{border-bottom:0}
.reason .src{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.part{background:var(--paper);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.part b{display:block;font-size:18px;color:var(--ink)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--petrol)}
.agent ol{list-style:none;padding:0;margin:0 0 14px}
.agent li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px;color:var(--ink-3)}
.agent li.done{color:var(--ink)}
.agent li .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:10px}
.agent li.done .dot{background:var(--low);border-color:var(--low);color:#fff}
.agent li.run .dot{border-color:var(--petrol);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.agent li.run .dot{animation:none}}
.draftnote{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--med-soft);color:var(--med);margin-left:8px;vertical-align:2px}
.verified{font-size:13px;color:var(--low);margin-top:10px}
.cite{color:var(--petrol);font-weight:600;cursor:help}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;max-width:none}
.trail-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:8px}
.trail-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.alertbox{border-left:4px solid var(--high);background:var(--high-soft);border-radius:0;padding:12px 16px;margin-bottom:16px}
.alertbox.clear{border-color:var(--low);background:var(--low-soft)}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form-row input[type=text]{flex:1 1 320px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:10px 12px}
.err{color:var(--high);font-size:13px;margin-top:8px}
.str-sec{margin-bottom:14px}
.str-sec label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.str-sec textarea{width:100%;min-height:76px;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--panel);resize:vertical;line-height:1.55}
.str-sec textarea.flag{border-color:var(--high)}
.evidence li{margin-bottom:8px;font-size:14px}
.modalveil{position:fixed;inset:0;background:rgba(10,16,22,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modalveil.open{display:flex}
.modal{background:var(--panel);border-radius:12px;padding:22px;max-width:460px;width:100%;border:1px solid var(--line)}
.modal select,.modal textarea{width:100%;margin:6px 0 12px;border:1px solid var(--line-2);border-radius:8px;padding:9px;background:var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:22px;text-align:center;color:var(--ink-2)}
.backlink{all:unset;cursor:pointer;color:var(--petrol);font-weight:500;font-size:14px;margin-bottom:10px;display:inline-block}
.menu-toggle{display:none}
.navgroup{font-size:12px;color:var(--ink-3);margin:14px 10px 4px;font-weight:600}
.dec{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.dec.release{background:var(--low-soft);color:var(--low)}.dec.hold{background:var(--med-soft);color:var(--med)}.dec.block{background:var(--high-soft);color:var(--high)}
.dec.override::after{content:" · by analyst";font-weight:500}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pulse{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.pulse i{width:8px;height:8px;border-radius:50%;background:var(--low)}
@media (prefers-reduced-motion:no-preference){.pulse i{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
tr.fresh td{animation:fresh 1.6s ease-out}@keyframes fresh{from{background:var(--petrol-soft)}to{background:transparent}}}
.dir{font-size:13px;font-weight:600}
.dir.in{color:var(--low)}.dir.out{color:var(--chain)}
.expo{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:6px 0 10px;background:var(--line)}
.expo span{display:block;height:100%}
.expokey{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;font-size:13px}
.expokey div{white-space:nowrap}
.expokey div::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;background:var(--c)}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:0}
.check .ic{font-weight:700}.check .ic.ok{color:var(--low)}.check .ic.no{color:var(--high)}.check .ic.warn{color:var(--med)}
.check small{grid-column:2;color:var(--ink-3);font-size:12.5px}
.decisionbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-radius:10px;margin-bottom:16px;border:1px solid var(--line)}
.decisionbar.release{background:var(--low-soft)}.decisionbar.hold{background:var(--med-soft)}.decisionbar.block{background:var(--high-soft)}
.decisionbar .big{font-size:22px;font-weight:700}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:6px 14px;align-items:center;margin:6px 0 16px}
.slider input{width:100%}
.slider output{font-weight:700;text-align:right}
.toggle{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.toggle:last-child{border-bottom:0}
.toggle input{margin-top:3px;width:16px;height:16px;accent-color:var(--petrol)}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preview div{border-radius:8px;padding:12px;font-size:13px}
.preview b{display:block;font-size:24px;letter-spacing:-.02em}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail .who{display:block!important;width:100%}
  nav.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .brand{padding:6px 8px;width:100%}
  .rail .who{display:none}
  .topbar{position:static;padding:12px 16px}
  .page{padding:18px 16px 50px}
  .parts{grid-template-columns:1fr 1fr 1fr}
}

.rolechip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--petrol-soft);color:var(--petrol);white-space:nowrap}
.stat-row{display:flex;gap:8px;align-items:center}
.status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.status.Active{background:var(--low-soft);color:var(--low)}.status.Invited,.status.Pending,.status.Trial{background:var(--med-soft);color:var(--med)}.status.Suspended{background:var(--high-soft);color:var(--high)}
.matrix th,.matrix td{text-align:center}.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix input{width:16px;height:16px;accent-color:var(--petrol)}
.matrix td.grp{background:var(--paper);font-weight:600;font-size:12.5px;color:var(--ink-3);text-align:left}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-size:14px}
.field label{font-weight:600;font-size:13.5px}
.field input,.field select{border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;background:var(--panel)}
.field small{color:var(--ink-3);font-size:12.5px}
.fields2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 16px}
.featrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.featrow:last-child{border-bottom:0}
.featrow small{color:var(--ink-3);font-size:13px}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:11px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--petrol)}.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.switch input:disabled+span{opacity:.45}
.keycard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;font-size:13px;color:var(--ink-2)}
.keycard b{display:block;color:var(--ink);font-size:14px}
.sod{border-left:4px solid var(--med);background:var(--med-soft);padding:10px 14px;margin-top:12px;font-size:13.5px}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.steps span{font-size:13px;padding:4px 10px;border-radius:14px;background:var(--paper);color:var(--ink-3);border:1px solid var(--line)}
.steps span.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.steps span.done{color:var(--low);border-color:var(--low)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;transition:width .2s}
.enrollcard{max-width:520px;margin:10px auto}

.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
.login .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.login .logo{display:flex;justify-content:center;margin-bottom:18px}
.login h1{font-size:21px;text-align:center;margin:0 0 6px}
.lsub{color:var(--ink-2);font-size:14px;text-align:center;margin:0 0 20px}
.login .full{width:100%;justify-content:center;display:flex;margin-top:4px;padding:10px 14px}
.lwho{display:flex;align-items:center;gap:8px;justify-content:center;margin:-4px 0 14px;font-size:13px;color:var(--ink-2)}
.lwho .mono{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:3px 10px}
.lback{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.lback:focus-visible{outline:2px solid var(--focus)}
.ltenant{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin:16px 0}
.ltenant .av{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.ltenant small{display:block;color:var(--ink-3);font-size:12.5px}
.lor{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-size:12.5px;color:var(--ink-3)}
.lor::before,.lor::after{content:"";flex:1;height:1px;background:var(--line)}
.lforgot{display:block;margin:14px auto 0}
.login .via{font-size:12px;color:var(--ink-3);margin:0}
.demo{margin-top:22px;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.demo summary{cursor:pointer;color:var(--petrol);font-weight:500;text-align:center}
.demo .dg{font-size:12px;color:var(--ink-3);font-weight:600;margin:12px 0 2px}
.demo button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;width:100%;padding:5px 6px;border-radius:6px;box-sizing:border-box}
.demo button:hover{background:var(--paper)}.demo button:focus-visible{outline:2px solid var(--focus)}
.demo button small{color:var(--ink-3);white-space:nowrap}
.demo p{color:var(--ink-3);font-size:12px;margin:10px 0 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-bottom:16px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--focus)}
.planchip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--chain-soft);color:var(--chain)}
.note{border-left:4px solid var(--chain);background:var(--chain-soft);padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.tmpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tmpl div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.tmpl b{display:block;color:var(--ink);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2l10 4v7c0 6.5-4.3 11.2-10 13-5.7-1.8-10-6.5-10-13V6z" fill="var(--petrol)"/><path d="M9 17l4-5 3 3 4-5" fill="none" stroke="var(--panel)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10" r="1.8" fill="var(--panel)"/></svg>
      <span>Sentrail</span>
    </div>
    <div class="tenant" id="tenant" aria-label="Current organization"></div>
    <button data-go="today" data-perm="cases.view">Today <span class="count" id="todoCount">0</span></button>
    <p class="navgroup" data-perm="cases.view">Monitor</p>
    <button data-go="live" data-perm="cases.view">Live screening <span class="count" id="heldCount">0</span></button>
    <button data-go="queue" data-perm="cases.view">Alerts <span class="count" id="openCount">0</span></button>
    <p class="navgroup" data-perm="wallet.trace">Investigate</p>
    <button data-go="wallet" data-perm="wallet.trace">Wallet trace</button>
    <button data-go="wallets" data-perm="wallet.trace">Customer wallets</button>
    <button data-go="upload" data-perm="cases.decide">Statements</button>
    <p class="navgroup" data-perm="cases.view">Govern</p>
    <button data-go="reports" data-perm="cases.view">Reports</button>
    <button data-go="policy" data-perm="cases.view">Screening policy</button>
    <button data-go="audit" data-perm="audit.view">Audit log</button>
    <p class="navgroup" data-perm-any="orgs.manage,platform.support">Tenants</p>
    <button data-go="orgs" data-perm-any="orgs.manage,platform.support">Organizations</button>
    <p class="navgroup" data-perm-any="users.manage,roles.manage,features.manage,platform.users.manage,platform.roles.manage,platform.plans.manage,platform.security.manage">Administration</p>
    <button data-go="users" data-perm-any="users.manage,platform.users.manage,platform.support" id="nav-users">Users and invitations</button>
    <button data-go="roles" data-perm-any="roles.manage,platform.roles.manage">Roles and permissions</button>
    <button data-go="features" data-perm-any="features.manage,platform.plans.manage" id="nav-features">Features</button>
    <button data-go="security" data-perm-any="users.manage,platform.security.manage">Security</button>
    <button data-go="adminaudit" data-perm="platform.audit.view">Platform audit</button>
    <div class="who"><label for="persona">Signed in as (demo switch)</label>
      <select id="persona" class="reason" style="width:100%;margin-top:4px"></select>
      <div id="orgline" style="margin-top:6px"></div>
      <div style="display:flex;gap:14px;margin-top:8px"><button class="linkbtn" data-go="account">My account</button><button class="linkbtn" id="signout">Sign out</button></div></div>
  </nav>
  <main>
    <div class="topbar" data-perm="cases.view">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--ink-3)" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="text" aria-label="Search" placeholder="Customer ID, account, card last 4, wallet address or transaction hash" autocomplete="off">
        <span class="kind" id="qkind">Type to search</span>
      </div>
      <select class="reason" id="qreason" aria-label="Reason for lookup">
        <option value="">Reason for lookup</option>
        <option>Alert investigation</option><option>Law enforcement request</option>
        <option>Customer complaint</option><option>Periodic review</option>
      </select>
      <button class="btn primary" id="qgo">Search</button>
    </div>
    <div class="page" id="view"></div>
  </main>
</div>

<div class="modalveil" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal">
    <h2 id="mtitle">Record decision</h2>
    <label for="mdecision" class="muted" style="font-size:13px">Decision</label>
    <select id="mdecision">
      <option value="file_str">File STR</option>
      <option value="false_positive">Close as false positive</option>
      <option value="request_info">Request information from customer</option>
      <option value="escalate">Escalate to senior officer</option>
    </select>
    <label for="mreason" class="muted" style="font-size:13px">Reason (saved to the audit log)</label>
    <textarea id="mreason" rows="3" placeholder="Activity is consistent with money mule indicators and the customer's profile doesn't explain the volume."></textarea>
    <div class="err" id="merr" hidden>Add a reason before saving.</div>
    <div class="actions"><button class="btn" id="mcancel">Cancel</button><button class="btn primary" id="msave">Save decision</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString("en-CA",{maximumFractionDigits:0});
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function seeded(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function fakeTron(r){let s="T";for(let i=0;i<33;i++)s+=B58[Math.floor(r()*58)];return s}
const short = a => a.length>16 ? a.slice(0,6)+"…"+a.slice(-5) : a;

const CASE_WALLET = "TQ7mWx3ZkP9vRb2LnH8sYcD4fGu6JtA1Ke";
const state = {
  analyst:"Ansuman P.",
  alerts:[
    {id:"A-1042",cid:"C-2291",name:"Rohan M.",score:87,band:"high",channels:["bank","crypto"],reason:"12 new senders in 5 days, then funds sent to a crypto wallet",status:"open",age:"2h"},
    {id:"A-1039",cid:"C-1877",name:"Priya S.",score:81,band:"high",channels:["bank"],reason:"4 deposits just below 10,000 in 6 days",status:"open",age:"5h"},
    {id:"A-1051",cid:"C-3310",name:"Kestrel Imports Ltd.",score:76,band:"high",channels:["bank","card"],reason:"Payments routed through a loop of 4 accounts",status:"open",age:"1h"},
    {id:"A-1033",cid:"C-0954",name:"Daniel O.",score:64,band:"medium",channels:["card"],reason:"71% of card spend at gift card and gambling merchants",status:"open",age:"1d"},
    {id:"A-1047",cid:"C-2048",name:"Meera K.",score:58,band:"medium",channels:["crypto"],reason:"USDT withdrawal to a wallet first seen 2 days ago",status:"open",age:"3h"},
    {id:"A-1028",cid:"C-1402",name:"Lucas B.",score:52,band:"medium",channels:["bank"],reason:"Account dormant 140 days, then 18,400 moved",status:"open",age:"2d"},
    {id:"A-1044",cid:"C-0771",name:"Anika T.",score:34,band:"low",channels:["bank"],reason:"Volume 2.1x declared income after salary change",status:"open",age:"6h"},
    {id:"A-1036",cid:"C-2655",name:"Farid H.",score:29,band:"low",channels:["card","bank"],reason:"Travel spend in 3 countries in one week",status:"open",age:"1d"}
  ],
  audit:[], filter:"all", agentRun:{}, decisions:{}
};
const CASES = {
  "C-2291":{profile:{occupation:"Student",income:"4,000 / month",kyc:"Medium",since:"Mar 2025",country:"Canada"},
    parts:{rules:80,model:91,network:88},
    reasons:[
      {src:"Model",text:"Volume is 8.2x the declared income",share:35},
      {src:"Rule: fan-in",text:"12 different senders in 5 days, 9 of them accounts opened in the last 30 days",share:28},
      {src:"Rule: structuring",text:"4 deposits between 9,500 and 9,900",share:22},
      {src:"Network",text:"Funds reached a listed wallet 2 hops after leaving this account",share:15}],
    txns:[
      ["Sep 2 09:14","in","bank",9850,"Transfer from ACC…4471"],["Sep 2 15:40","in","bank",3200,"Transfer from ACC…8812"],
      ["Sep 3 10:02","in","bank",9600,"Transfer from ACC…1903"],["Sep 3 18:21","out","card",84,"Card ••4417, grocery"],
      ["Sep 4 11:47","in","bank",9900,"Transfer from ACC…5520"],["Sep 5 08:30","in","bank",9500,"Transfer from ACC…3367"],
      ["Sep 5 21:12","in","bank",5350,"8 smaller transfers, 8 senders"],["Sep 6 09:05","out","crypto",46000,"Bought USDT, sent to "+short(CASE_WALLET)]],
    summary:'Between 2 and 6 September the customer received 48,200 from 12 accounts, 9 of which were opened in the last 30 days. Four deposits fell between 9,500 and 9,900. On 6 September, 46,000 was converted to USDT and withdrawn to an external TRON wallet. Two hops later, the funds reached a wallet on the institution\'s blocklist. The customer is a student with declared income of 4,000 a month, so the volume isn\'t explained by the profile. The pattern matches money mule indicators <span class="cite" title="FINTRAC STR guidance, ML indicators section">[1]</span> and virtual asset red flags <span class="cite" title="FATF red flag indicators for virtual assets">[2]</span>.',
    figures:6},
};
function genericCase(a){
  const r=seeded(a.cid);
  const sx=a.src&&SCR.find(x=>x.id===a.src);
  if(sx){const rs=whyOf(sx).concat(sx.signals).slice(0,4), sh=[46,28,16,10];
    return {profile:{occupation:["Engineer","Retail worker","Business owner","Consultant"][Math.floor(r()*4)],income:fmt(3000+Math.floor(r()*9000))+" / month",kyc:"Medium",since:"2024",country:"Canada"},
      parts:{rules:sx.sanction?100:Math.min(99,sx.score+5),model:sx.score,network:Math.min(99,sx.expo.scam+sx.expo.sanctioned+20)},
      reasons:rs.map((t,i)=>({src:i<whyOf(sx).length?"Screening decision":"Wallet behaviour",text:t,share:sh[i]})),
      txns:[["Today "+sx.t.slice(0,5),sx.dir,"crypto",sx.amt,`${sx.asset} on ${sx.net}, ${sx.dir==="in"?"from":"to"} ${short(sx.wallet)} (${DEC_LABEL[decisionOf(sx)].toLowerCase()} at screening)`]],
      summary:`Screening ${decisionOf(sx)==="block"?"blocked":"held"} a ${fmt(sx.amt)} ${sx.asset} ${sx.dir==="in"?"deposit from":"withdrawal to"} a ${sx.host.toLowerCase()} wallet. ${sx.expo.sanctioned?sx.expo.sanctioned+"% of the wallet's funds trace to a sanctioned address. ":""}${sx.expo.scam?sx.expo.scam+"% trace to reported scam wallets. ":""}${sx.signals[0]?sx.signals[0]+". ":""}Review the wallet trail and the customer's history before deciding.`,figures:2,wallet:sx.wallet};}
  return {profile:{occupation:["Engineer","Retail worker","Business owner","Consultant"][Math.floor(r()*4)],income:fmt(3000+Math.floor(r()*9000))+" / month",kyc:a.band==="high"?"Medium":"Low",since:"2024",country:"Canada"},
    parts:{rules:Math.round(a.score*0.9),model:Math.min(99,a.score+4),network:Math.max(10,a.score-12)},
    reasons:[{src:"Main finding",text:a.reason,share:46},{src:"Model",text:"30-day volume above the customer's normal range",share:31},{src:"Model",text:"More new counterparties than usual",share:23}],
    txns:[["Sep 1 10:12","in","bank",4200,"Transfer received"],["Sep 3 13:30","out",a.channels.includes("card")?"card":"bank",1250,"Payment sent"],["Sep 4 16:45","in","bank",6800,"Transfer received"]],
    summary:"The main finding is: "+a.reason.toLowerCase()+". The rest of the account history is broadly in line with the customer's profile. Review the transactions before deciding whether this needs a report.",figures:3};
}
const caseOf = a => CASES[a.cid] || genericCase(a);

function log(action,target,detail=""){state.audit.unshift({at:new Date().toLocaleTimeString("en-CA",{hour:"2-digit",minute:"2-digit"}),user:PERSONA().name,action,target,detail});}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400)}
const scoreCell = (s,b) => `<span class="score">${s}<i><b style="width:${s}%;background:var(--${b==="high"?"high":b==="medium"?"med":"low"})"></b></i></span>`;
const chans = cs => cs.map(c=>`<span class="ch ${c}">${c==="crypto"?"Crypto":c==="card"?"Card":"Bank"}</span>`).join("");

/* ---------- Routing ---------- */
let route={name:"today"};
function go(name,arg){route={name,arg};render();window.scrollTo(0,0)}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
function render(){
  if(!signedIn){renderLogin();return}
  if(!routeAllowed(route.name)){route={name:firstAllowed()}}
  document.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===route.name||(route.name==="case"&&b.dataset.go==="queue")||(route.name==="str"&&b.dataset.go==="reports")||(route.name==="shot"&&b.dataset.go==="live")?"page":"false"));
  $("#openCount").textContent=state.alerts.filter(a=>a.status==="open").length;
  if(!can("cases.view")){ $("#todoCount").textContent=0; }
  const todo=can("cases.view")?todoItems():[]; $("#todoCount").textContent=todo.length;
  $("#heldCount").textContent=SCR.filter(x=>decisionOf(x)==="hold"&&!x.override).length;
  ({account:renderAccount,orgs:renderOrgs,users:renderUsers,roles:renderRoles,features:renderFeatures,security:renderSecurity,adminaudit:renderAdminAudit,enroll:renderEnroll,denied:renderDenied,today:renderToday,live:renderLive,shot:renderShot,wallets:renderWallets,policy:renderPolicy,queue:renderQueue,case:renderCase,wallet:renderWallet,str:renderSTR,reports:renderReports,upload:renderUpload,audit:renderAudit})[route.name]();
}

/* ---------- Queue ---------- */
function renderQueue(){
  const open=state.alerts.filter(a=>a.status==="open");
  const n=b=>open.filter(a=>a.band===b).length;
  const list=open.filter(a=>state.filter==="all"||a.band===state.filter).sort((a,b)=>b.score-a.score);
  $("#view").innerHTML=`
    <h1>Alerts</h1>
    <p class="sub">Alerts are scored automatically from bank, card and crypto activity. Highest risk is at the top.</p>
    <div class="chips" role="group" aria-label="Filter by risk">
      ${[["all","All open",open.length],["high","High",n("high")],["medium","Medium",n("medium")],["low","Low",n("low")]].map(([k,l,c])=>`<button class="chip" aria-pressed="${state.filter===k}" data-f="${k}">${l} · ${c}</button>`).join("")}
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Score</th><th>Risk</th><th>Customer</th><th>Main reason</th><th>Channels</th><th>Raised</th></tr></thead>
      <tbody>${list.map(a=>`<tr class="click" tabindex="0" data-id="${a.id}">
        <td>${scoreCell(a.score,a.band)}</td><td><span class="band ${a.band}">${a.band[0].toUpperCase()+a.band.slice(1)}</span></td>
        <td><b>${a.name}</b><div class="muted mono">${a.cid}</div></td><td style="max-width:340px">${a.reason}</td><td>${chans(a.channels)}</td><td class="muted">${a.age} ago</td></tr>`).join("")
        || `<tr><td colspan="6" class="muted">No open alerts at this risk level.</td></tr>`}</tbody>
    </table></div>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;renderQueue()});
  document.querySelectorAll("tr[data-id]").forEach(r=>{const open=()=>go("case",r.dataset.id);r.onclick=open;r.onkeydown=e=>{if(e.key==="Enter")open()}});
}

/* ---------- Case ---------- */
function renderCase(){
  const a=state.alerts.find(x=>x.id===route.arg); const c=caseOf(a);
  log("Viewed case",a.id);
  const ran=state.agentRun[a.id];
  $("#view").innerHTML=`
    <button class="backlink" data-back>← Alerts</button>
    <div class="casehead">
      <div><h1>${a.name}</h1>
        <div class="facts" style="margin-top:8px">
          <div>Customer<b class="mono">${a.cid}</b></div><div>Occupation<b>${c.profile.occupation}</b></div>
          <div>Declared income<b>${c.profile.income}</b></div><div>KYC risk<b>${c.profile.kyc}</b></div><div>Customer since<b>${c.profile.since}</b></div>
        </div></div>
      <div class="dial"><div class="num" style="color:var(--${a.band==="high"?"high":a.band==="medium"?"med":"low"})">${a.score}</div>
        <div><span class="band ${a.band}">${a.band[0].toUpperCase()+a.band.slice(1)} risk</span><div class="muted" style="font-size:13px;margin-top:4px">Alert ${a.id} · ${a.status==="open"?"Open":a.status}</div></div></div>
    </div>
    <div class="grid g2">
      <section class="panel"><h2>Why this was flagged</h2>
        ${c.reasons.map(r=>`<div class="reason"><span>${r.text}</span><b>${r.share}%</b><span class="src">${r.src}</span></div>`).join("")}
        <div class="parts">${[["Rules",c.parts.rules],["Behaviour model",c.parts.model],["Money network",c.parts.network]].map(([l,v])=>`<div class="part">${l}<b>${v}</b><div class="bar"><span style="width:${v}%"></span></div></div>`).join("")}</div>
      </section>
      <section class="panel"><h2>Money flow</h2>${flowSVG(a,c)}
        <div class="trail-legend"><span style="--c:var(--ink-3)">Senders</span><span style="--c:var(--med)">This customer</span><span style="--c:var(--chain)">Crypto wallet</span><span style="--c:var(--high)">Listed wallet</span></div>
        ${a.cid==="C-2291"||c.wallet?`<div class="actions" style="justify-content:flex-start"><button class="btn" data-trace>Trace the ${c.wallet?"counterparty":"withdrawal"} wallet</button></div>`:""}
      </section>
    </div>
    <section class="panel" style="margin-top:16px"><h2>Activity across bank, card and crypto</h2>
      <div class="chips" role="group" aria-label="Filter activity">${["All","Bank","Card","Crypto"].map((k,i)=>`<button class="chip" aria-pressed="${i===0}" data-tf="${k.toLowerCase()}">${k}</button>`).join("")}</div>
      <div class="tablewrap" style="border:0"><table><thead><tr><th>When</th><th>Direction</th><th>Channel</th><th style="text-align:right">Amount (CAD)</th><th>Details</th></tr></thead>
      <tbody id="txbody"></tbody></table></div>
    </section>
    <section class="panel agent" style="margin-top:16px"><h2>AI investigation ${ran?'<span class="draftnote">Draft · needs your review</span>':""}</h2>
      <div id="agentArea">${ran?agentDone(a,c):`<p class="muted" style="margin-top:0">The assistant runs on a local open-source model. Personal data is masked before analysis and every figure is checked against the transaction records.</p><button class="btn primary" data-perm="str.draft" data-run>Run investigation</button>`}</div>
    </section>
    <div class="actions">
      <button class="btn" data-perm="cases.decide" data-decide="request_info">Request info from customer</button>
      <button class="btn" data-perm="cases.decide" data-decide="false_positive">Close as false positive</button>
      <button class="btn primary" data-perm="str.draft" data-str ${ran?"":"disabled title='Run the investigation first'"} style="${ran?"":"opacity:.5"}">Draft STR</button>
    </div>`;

function buildTrace(addr){

  const h1=Array.from({length:isCase?3:3+Math.floor(r()*2)},()=>({id:fakeTron(r),amt:0}));
  let total=isCase?46000:Math.round(5000+r()*60000); let left=total;
  h1.forEach((n,i)=>{n.amt=i===h1.length-1?left:Math.round(left*(0.45+r()*0.2));left-=n.amt});
  const h2=[]; h1.forEach((p,i)=>{const k=1+Math.floor(r()*2);for(let j=0;j<k;j++)h2.push({id:fakeTron(r),from:p.id,amt:Math.round(p.amt*(k===1?0.95:0.5)),flag:false})});
  const flagIt = isCase || r()<0.4;

function analyzeCSV(text){
  const [head,...lines]=text.trim().split(/\r?\n/); const cols=head.split(",").map(s=>s.trim());
  const need=["timestamp","direction","amount","counterparty_id"].filter(c=>!cols.includes(c));
  if(need.length){$("#upout").innerHTML=`<div class="err">Missing columns: ${need.join(", ")}. Add them and upload again.</div>`;return}
  const rows=lines.map(l=>{const v=l.split(",");const o={};cols.forEach((c,i)=>o[c]=v[i]);o.amount=+o.amount;o.t=new Date(o.timestamp);return o}).filter(r=>!isNaN(r.amount));
  const exp=+$("#exp").value.replace(/,/g,"")||0, hits=[];
  const near=rows.filter(r=>r.amount>=9000&&r.amount<10000); if(near.length>=3) hits.push(`Structuring: ${near.length} transactions just below 10,000`);
  const ins=rows.filter(r=>r.direction==="in"); const snd=new Set(ins.map(r=>r.counterparty_id)).size; if(snd>=8) hits.push(`Fan-in: ${snd} different senders`);
  const vol=ins.reduce((s,r)=>s+r.amount,0); if(exp&&vol>3*exp) hits.push(`Velocity: received ${fmt(vol)}, ${(vol/exp).toFixed(1)}x declared income`);
  const big=rows.filter(r=>r.direction==="out"&&r.amount>0.8*vol&&vol>0); if(big.length) hits.push(`Rapid movement: ${fmt(big[0].amount)} sent out after the deposits`);
  const score=Math.min(100,hits.length*24);
  $("#upout").innerHTML=`<div style="margin-top:16px" class="alertbox ${hits.length?"":"clear"}"><b>${rows.length} transactions checked · score ${score}</b>
    <div>${hits.length?hits.map(h=>`<div>• ${h}</div>`).join(""):"No rule hits in this statement."}</div></div>
    <p class="muted" style="font-size:13px;margin:0">Uploaded statements are scored with rules only. The behaviour model and money network need the customer's full history.</p>`;
  log("Analyzed statement","upload",rows.length+" rows, "+hits.length+" hits");
}

function decisionOf(x){
  if(x.override) return x.override;
  if(x.sanction&&POLICY.blockSanctions) return "block";
  if(x.score>=POLICY.blockAt) return "block";
  if(x.score>=POLICY.holdAt) return "hold";
  if(POLICY.travelRule&&x.amt>=POLICY.travelMin&&/^Missing/.test(x.travel)) return "hold";
  if(POLICY.ownProof&&x.host==="Self-hosted"&&x.amt>=POLICY.travelMin&&!x.own) return "hold";
  return "release";
}
function whyOf(x){
  const w=[];
  if(x.sanction&&POLICY.blockSanctions) w.push("Wallet is on a sanctions list, which always blocks");
  if(x.score>=POLICY.blockAt) w.push(`Risk score ${x.score} is at or above the block level (${POLICY.blockAt})`);
  else if(x.score>=POLICY.holdAt) w.push(`Risk score ${x.score} is at or above the review level (${POLICY.holdAt})`);
  if(POLICY.travelRule&&x.amt>=POLICY.travelMin&&/^Missing/.test(x.travel)) w.push("Travel rule information is missing for this amount");
  if(POLICY.ownProof&&x.host==="Self-hosted"&&x.amt>=POLICY.travelMin&&!x.own) w.push("Customer hasn't proven they own this self-hosted wallet");
  return w.length?w:["Score below the review level and all checks passed"];
}

    log({pw:"Started password change",pk:"Started passkey setup",rc:"Regenerated recovery codes"}[b.dataset.acct],PERSONA().name);toast(t)});
}

 {id:"p3",name:"Priya N.",email:"priya.n@sentrail.io",role:"Platform support",signin:"Keycloak + passkey",status:"Active",last:"Today 08:15"},

     <div class="tablewrap"><table><thead><tr><th>Person and sign-in</th><th>Email</th><th>Role</th><th>Status</th><th>Last active</th><th></th></tr></thead><tbody>

function renderPlatformSecurity(){
  const tenants=[{n:"Northwind Remit Inc.",pw:14,idle:15,ret:5},{n:"Maple Ridge Digital Assets",pw:16,idle:20,ret:7},{n:"Harbourline Payments",pw:14,idle:30,ret:5}];
  $("#view").innerHTML=`<h1>Security</h1><p class="sub">The baseline every organization must meet. Organizations can be stricter, never looser.</p>
   <div class="grid g2">
    <section class="panel"><h2>Baseline for all organizations</h2>
     <div class="featrow"><div><b>Two-step verification</b><br><small>Always required for every account. This can't be turned off.</small></div><label class="switch"><input type="checkbox" checked disabled aria-label="Two-step verification always on"><span></span></label></div>
     <div class="fields2" style="margin-top:12px">
      <div class="field"><label for="bpw">Minimum password length</label><input id="bpw" type="number" min="12" max="64" value="${PSEC.minPw}"></div>
      <div class="field"><label for="bidle">Longest inactivity before sign-out (minutes)</label><input id="bidle" type="number" min="5" max="60" value="${PSEC.maxIdle}"></div>

     <p style="font-weight:600;font-size:13.5px;margin:12px 0 6px">Data regions offered</p>
     ${["Canada (Montréal)","Canada (Toronto)"].map(r=>`<label style="display:inline-flex;gap:6px;margin:0 16px 8px 0;font-size:14px"><input type="checkbox" class="breg" value="${r}" ${PSEC.regions.includes(r)?"checked":""} style="accent-color:var(--petrol)">${r}</label>`).join("")}
     <div id="bimpact" class="sod" style="margin-top:10px"></div>
     <div class="err" id="berr" hidden></div>
     <div class="actions"><button class="btn primary" id="bsave">Save baseline</button></div></section>
    <div class="grid">
     <section class="panel"><h2>Identity provider</h2><div class="keycard"><div>Service<b>Keycloak 26</b></div><div>Realm<b>sentrail</b></div><div>Brute-force lockout<b>5 attempts</b></div><div>Self-registration<b>Off</b></div></div>
      <p class="muted" style="font-size:13px;margin:12px 0 0">Organizations connect their own Entra ID, Google Workspace or Okta through Keycloak after proving their domain by DNS.</p></section>
     <section class="panel"><h2>Encryption</h2><div class="keycard"><div>Personal data<b>AES-256-GCM</b></div><div>Keys<b>OpenBao transit</b></div><div>Current key<b>${SEC.keyVer}</b></div><div>Isolation<b>Row-level security</b></div></div>
      <div class="actions"><button class="btn" id="brot">Rotate key now</button></div></section>
    </div></div>`;
  const impact=()=>{const pw=+$("#bpw").value,idle=+$("#bidle").value,ret=+$("#bret").value;

  $("#bsave").onclick=()=>{const pw=+$("#bpw").value,idle=+$("#bidle").value,ss=+$("#bsess").value,ret=+$("#bret").value,e=$("#berr");

}

/* ---------- Universal search ---------- */
function classify(q){
  q=q.trim(); if(!q) return {kind:"empty",label:"Type to search"};
  if(/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(q)) return {kind:"wallet",label:"TRON wallet"};
  if(/^0x[a-fA-F0-9]{40}$/.test(q)) return {kind:"wallet",label:"Ethereum wallet"};
  if(/^(bc1[a-z0-9]{25,62}|[13][a-km-zA-HJ-NP-Z1-9]{25,34})$/.test(q)) return {kind:"wallet",label:"Bitcoin wallet"};
  if(/^(0x)?[a-fA-F0-9]{64}$/.test(q)) return {kind:"tx",label:"Transaction hash"};
  if(/^\d{12,19}$/.test(q.replace(/[\s-]/g,""))&&q.replace(/[\s-]/g,"").length>=12) return {kind:"pan",label:"Full card number not allowed"};
  if(/^\d{4}$/.test(q)) return {kind:"card",label:"Card, last 4 digits"};
  if(/^C-\d+$/i.test(q)) return {kind:"customer",label:"Customer ID"};
  if(/^[A-Z]{2,4}\d{6,14}$/i.test(q)) return {kind:"account",label:"Account number"};
  return {kind:"name",label:"Name search"};
}
const qi=$("#q"), qk=$("#qkind");
qi.addEventListener("input",()=>{const k=classify(qi.value);qk.textContent=k.label;qk.className="kind "+(k.kind==="wallet"?"wallet":k.kind==="pan"?"bad":k.kind==="empty"?"":"ok")});
function doSearch(){
  const v=qi.value.trim(), k=classify(v);
  if(k.kind==="empty"){toast("Type something to search");return}
  if(k.kind==="pan"){toast("Search by the last 4 digits or card token instead");return}
  if(!$("#qreason").value){toast("Choose a reason for this lookup first");$("#qreason").focus();return}
  log("Searched",k.kind==="wallet"?short(v):v,k.label+" · "+$("#qreason").value);
  if(k.kind==="wallet") return go("wallet",v);
  const a=state.alerts.find(x=>x.cid.toLowerCase()===v.toLowerCase()||x.name.toLowerCase().includes(v.toLowerCase())||(k.kind==="card"&&v==="4417"&&x.cid==="C-2291"));
  if(a) return go("case",a.id);
  toast("No customer found for "+v);
}
$("#qgo").onclick=doSearch; qi.addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("open")});
SCR.filter(x=>decisionOf(x)!=="release").forEach(raiseAlert);
renderTenant();
render();
