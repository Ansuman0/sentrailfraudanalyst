# GCP deployment overlay: run the images that the GitHub pipeline pushed to Artifact Registry instead of building on the server.
#   docker compose --env-file .env --env-file .deploy.env -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.gcp.yml up -d --no-build ...
# .deploy.env (written by scripts/deploy-gcp.sh) holds REGISTRY, API_TAG and WEB_TAG. See docs/DEPLOYMENT_GCP.md.
services:
  migrate:                                                 # same image as the API
    image: ${REGISTRY:?set by scripts/deploy-gcp.sh}/sentrail-api:${API_TAG:?set by scripts/deploy-gcp.sh}
    pull_policy: always

  api:
    image: ${REGISTRY:?set by scripts/deploy-gcp.sh}/sentrail-api:${API_TAG:?set by scripts/deploy-gcp.sh}
    pull_policy: always
    volumes:
      - api-data:/srv/data                                 # named volume instead of ./backend/data (the repo is not on the server)

  web:
    image: ${REGISTRY:?set by scripts/deploy-gcp.sh}/sentrail-web:${WEB_TAG:?set by scripts/deploy-gcp.sh}
    pull_policy: always

volumes:
  api-data:
